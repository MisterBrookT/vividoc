name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0-120s)
        run: sleep $((RANDOM % 120))

      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set, skipping"
            exit 0
          fi
          curl -sf "${BACKEND_URL}/health" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" || echo "Ping failed"
