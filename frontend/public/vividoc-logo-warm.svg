<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)"/>
  
  <!-- Document icon with interactive elements -->
  <!-- Document base -->
  <rect x="18" y="16" width="28" height="32" rx="2" fill="white" opacity="0.95"/>
  
  <!-- Document lines (representing text) -->
  <line x1="22" y1="22" x2="38" y2="22" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="27" x2="42" y2="27" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="36" y2="32" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Interactive element - sparkle/star -->
  <circle cx="38" cy="38" r="6" fill="url(#grad1)"/>
  <path d="M38 34 L38 42 M34 38 L42 38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small accent dots -->
  <circle cx="24" cy="42" r="1.5" fill="url(#grad2)"/>
  <circle cx="29" cy="42" r="1.5" fill="url(#grad2)"/>
</svg>
